<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <!-- Border -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.4"/>
  
  <!-- Cyber Grid lines -->
  <line x1="0" y1="256" x2="512" y2="256" stroke="#334155" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#334155" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" stroke-dasharray="8 8"/>
  
  <!-- Fighter Ship -->
  <g transform="translate(256, 256) rotate(-90) scale(1.6)" filter="url(#neonGlow)">
    <polygon points="50,0 -40,-35 -15,0 -40,35" fill="url(#shipGrad)" stroke="#7dd3fc" stroke-width="3"/>
    <ellipse cx="5" cy="0" rx="12" ry="6" fill="#ffffff"/>
    <polygon points="-40,-15 -65,-5 -65,5 -40,15" fill="#f43f5e" opacity="0.9"/>
  </g>
  
  <!-- Energy Sparkles -->
  <circle cx="160" cy="140" r="8" fill="#facc15" filter="url(#neonGlow)"/>
  <circle cx="360" cy="150" r="6" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="340" cy="380" r="9" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
