<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Neon Survivor: Cyber Arcade</title>
    <meta name="description" content="네온 사이버 아케이드 서바이벌 게임 - 모바일 PWA 앱" />
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="background-color" content="#090d16" />
    
    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeonSurvivor" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Neon Survivor" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="Neon Survivor: Cyber Arcade" />
    <meta property="og:description" content="네온 사이버 아케이드 서바이벌 게임! 모바일에서 앱으로 설치하고 즐기세요." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-950 select-none overflow-hidden touch-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
            .catch((err) => console.warn('PWA SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
